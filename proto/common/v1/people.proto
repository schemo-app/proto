syntax = "proto3";

package common.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/schemo-app/proto/go/common/v1;common";

message RoleRef {
  string id = 1;

  string name = 2;
}

message Person {
  string user_id = 1;
  string email = 2;
  string name = 3;

  // True when the account has been deleted. The row stays so that history keeps a name to show.
  bool deleted = 4;
}

message Member {
  Person person = 1;
  RoleRef role = 2;
  google.protobuf.Timestamp joined_at = 3;
}
