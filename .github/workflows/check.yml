name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: go tool -modfile=tools/go.mod buf --version
      - run: go tool -modfile=tools/go.mod task check
      - run: go tool -modfile=tools/go.mod task generate
      - run: git diff --exit-code
      - run: test -z "$(git ls-files --others --exclude-standard)"
      - run: npm pack --dry-run

  go:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        go: ['1.26.7', '1.27.2']
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go }}
      - run: go test . ./go/... ./snapshot/... ./schema
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: local

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, go]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
      - run: |
          test "$TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          npm pack --ignore-scripts
          gh release create "$TAG" ./*.tgz --verify-tag --title "$TAG" --notes-from-tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
